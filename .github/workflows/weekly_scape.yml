name: Volvo Price Scraper

on:
  schedule:
    # Sunday 00:00 UTC (GitHub often starts scheduled runs a few hours late)
    - cron: '0 0 * * 0'
    # Fallback later on Sunday: only scrapes if the first run saved nothing today
    - cron: '0 14 * * 0'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check whether today's data already exists
        id: check
        run: |
          if grep -q ",$(date -u +%F)$" data/volvo_price_tracker.csv; then
            echo "Data for $(date -u +%F) already saved; skipping scrape."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup R
        if: steps.check.outputs.skip != 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          Rscript -e 'install.packages(c("tidyverse", "rvest", "chromote"))'

      - name: Run scraper
        id: scrape
        if: steps.check.outputs.skip != 'true'
        run: Rscript VolvoScraper.r

      # Runs even if the scraper reported an incomplete scrape, so partial data is kept
      - name: Commit and Push changes
        if: always() && steps.check.outputs.skip != 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/volvo_price_tracker.csv
          git commit -m "Weekly data update: $(date)" || echo "No changes to commit"
          git push

      # Screenshots and HTML of pages that failed to load, for diagnosis
      - name: Upload debug files
        if: failure() && steps.scrape.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: scraper-debug
          path: debug/
          if-no-files-found: ignore
